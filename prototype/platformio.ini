[platformio]
default_envs = m5stack-cores3-lite-app

[env:m5stack-core2]
build_src_filter = +<*> -<diagnostics/>

platform = espressif32@6.12.0
board = m5stack-core2
framework = arduino

monitor_speed = 115200

lib_ldf_mode = deep+

lib_deps =
    m5stack/M5Unified@0.2.25
    m5stack/M5GFX@0.2.32

build_flags =
    -DNAPETUNE_USB_INIT_DIAG=1
    -DCORE_DEBUG_LEVEL=0

    -DBOARD_HAS_PSRAM
    -DHAVE_CONFIG_H
    -DportTICK_RATE_MS=portTICK_PERIOD_MS
    -DxQueueHandle=QueueHandle_t
    -Wl,--wrap=tuh_max3421_spi_cs_api

    -Iinclude

board_build.flash_size = 16MB
board_build.embed_files =
    src/assets/iz_sleep_bed_132x88.png
    src/assets/iz_sleep_portrait_98x128.png
    src/assets/hangar_mecha_front_v7_184x132.png
    src/assets/hangar_mecha_rear_v7_184x132.png
    src/assets/demo_prologue_qr_132x132.png
    src/assets/demo_terminalis_kv_320x240.png
    src/assets/iz_comms_face_152x157.png

; USB v1.2 CS selector: M-BUS pin 22, marked GPIO13 on the module
; schematic (GPIO19 on Core2). INT selector remains unchanged.
[env:m5stack-core2-usb-cs19]
extends = env:m5stack-core2
build_flags =
    ${env:m5stack-core2.build_flags}
    -DNAPETUNE_USB_CS_PIN=19
    -DNAPETUNE_USB_CS_PATH_DIAG=1
    -DNAPETUNE_MAX3421_SPI_HZ=12000000UL
    -DCORE2_INPUT_PERF_LOG=1

; CoreS3 Lite application build.
[env:m5stack-cores3-lite-app]
extends = env:m5stack-core2
board = m5stack-cores3
monitor_dtr = 0
monitor_rts = 0
board_build.arduino.memory_type = qio_qspi
board_build.psram_type = qspi
board_build.flash_mode = qio
board_build.flash_size = 16MB
build_flags =
    ${env:m5stack-core2.build_flags}
    -DNAPETUNE_BOARD_CORES3_LITE=1
    -DNAPETUNE_USB_CS_PIN=7
    -DNAPETUNE_MAX3421_SPI_HZ=12000000UL
